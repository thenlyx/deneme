name: Build WhatsApp Tek Bildirim APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Tek-Bildirim-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to apk branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/WhatsApp-Tek-Bildirim-debug.apk"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk
          git rm -rf . -q
          cp "$RUNNER_TEMP/WhatsApp-Tek-Bildirim-debug.apk" .
          git add WhatsApp-Tek-Bildirim-debug.apk
          git commit -m "APK build ${GITHUB_SHA}"
          git push -f origin apk
